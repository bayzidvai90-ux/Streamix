name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Find ZIP
        id: find_zip
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f -print

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Android project ZIP
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f | head -200

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Looking for Gradle files..."
            find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \)
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle-8.9-bin.zip -d "$HOME"

          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

          "$HOME/gradle-8.9/bin/gradle" --version

      - name: Remove broken Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          echo "Broken Gradle wrapper removed."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon \
            --stacktrace \
            --info \
            assembleDebug

      - name: Find APK
        id: find_apk
        run: |
          echo "Searching for APK..."

          APK=$(find "${PROJECT_DIR}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            echo "All APK files:"
            find "${PROJECT_DIR}" -type f -name "*.apk" || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Rename Debug APK
        run: |
          mkdir -p output
          cp "$APK_PATH" output/Streamix-debug.apk

          echo "Final APK:"
          ls -lh output/Streamix-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Debug-APK
          path: output/Streamix-debug.apk
          if-no-files-found: error
