name: Build Streamix BD APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract Android project
        id: project
        shell: bash
        run: |
          set -euxo pipefail

          WORKSPACE="$GITHUB_WORKSPACE"
          PROJECT_DIR=""

          if [[ -f "$WORKSPACE/settings.gradle" ||
                -f "$WORKSPACE/settings.gradle.kts" ]]; then
            PROJECT_DIR="$WORKSPACE"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            ZIP_FILE="$(find "$WORKSPACE" -maxdepth 2 -type f -iname '*.zip' \
              -print -quit || true)"

            if [[ -n "$ZIP_FILE" ]]; then
              rm -rf "$WORKSPACE/.android-project"
              mkdir -p "$WORKSPACE/.android-project"
              unzip -q -o "$ZIP_FILE" -d "$WORKSPACE/.android-project"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            SETTINGS_FILE="$(find "$WORKSPACE/.android-project" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit || true)"

            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: No Android Gradle project was found."
              find "$WORKSPACE" -maxdepth 4 -type f | sort | head -300
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          echo "Android project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -300

      - name: Install Gradle 9.3.1
        shell: bash
        run: |
          set -euxo pipefail

          GRADLE_VERSION="9.3.1"
          GRADLE_HOME="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          mkdir -p "$RUNNER_TEMP"

          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          rm -rf "$GRADLE_HOME"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$GRADLE_HOME/bin" >> "$GITHUB_PATH"

          "$GRADLE_HOME/bin/gradle" --version

      - name: Prepare Gradle build
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x gradlew 2>/dev/null || true

          echo "Using Gradle:"
          gradle --version

          echo "Project root:"
          pwd

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( -name "settings.gradle*" \
               -o -name "build.gradle*" \
               -o -name "gradle-wrapper.properties" \) \
            -print

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all

      - name: Find Debug APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find app/build/outputs/apk/debug \
            -type f -name '*.apk' \
            -print -quit || true)"

          if [[ -z "$APK" ]]; then
            echo "ERROR: Debug APK was not generated."
            find app/build/outputs -maxdepth 6 -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo "APK: $APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
