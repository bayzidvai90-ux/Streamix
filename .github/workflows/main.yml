name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -200

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP found: $ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted

            unzip -q "$ZIP_FILE" -d extracted

            echo "Extracted files:"
            find extracted -maxdepth 4 -type f | sort | head -200
          else
            echo "No ZIP found. Using repository itself."
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          for f in \
            extracted/settings.gradle.kts \
            extracted/settings.gradle \
            extracted/*/settings.gradle.kts \
            extracted/*/settings.gradle \
            settings.gradle.kts \
            settings.gradle
          do
            if [ -f "$f" ]; then
              PROJECT_DIR="$(dirname "$f")"
              break
            fi
          done

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted . -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android/Gradle project not found."
            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "Project files:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort | head -250

      - name: Install Gradle 8.7.2
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.7.2"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Repair Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Removing broken wrapper files..."

          rm -f gradle/wrapper/gradle-wrapper.jar || true
          rm -f gradle/wrapper/gradle-wrapper.properties || true

          mkdir -p gradle/wrapper

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          echo "Generating fresh Gradle wrapper..."

          gradle wrapper \
            --gradle-version 8.7.2 \
            --distribution-type bin \
            --no-daemon

          chmod +x gradlew

          ./gradlew --version

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Find Debug APK
        id: find_apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK=$(find . -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            echo "Searching all APK files..."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/Streamix-Debug.apk"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Debug-APK
          path: apk/Streamix-Debug.apk
          if-no-files-found: error
          retention-days: 7
