name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -n "$ZIP" ]; then
            echo "Found project ZIP: $ZIP"
            rm -rf project
            mkdir project
            unzip -q "$ZIP" -d project
          fi

          GRADLE_DIR="$(find . -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path './.git/*' \
            -not -path './project/gradle/*' \
            -print -quit | xargs -r dirname)"

          if [ -z "$GRADLE_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find . -maxdepth 4 -type f | sort | head -200
            exit 1
          fi

          echo "Project found at: $GRADLE_DIR"
          echo "PROJECT_DIR=$GRADLE_DIR" >> "$GITHUB_ENV"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regenerate Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.9

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find "${PROJECT_DIR}" -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-Debug-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
