name: Build Streamix BD APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check project
        shell: bash
        run: |
          set -e

          echo "Project root:"
          pwd

          echo "Project files:"
          ls -la

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          echo "Gradle wrapper:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all

      - name: Find Debug APK
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
