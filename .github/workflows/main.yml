name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project ZIP
        run: |
          mkdir -p project
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android project ZIP not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Locate Gradle project
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/project" \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            | head -n 1 | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Repair Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f gradle/wrapper/gradle-wrapper.jar

          mkdir -p gradle/wrapper

          wget -q \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /tmp/gradle

          /tmp/gradle/gradle-8.9/bin/gradle wrapper \
            --gradle-version 8.9 \
            --distribution-type bin

          chmod +x gradlew

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find Debug APK
        id: apk
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          APK=$(find . -type f -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            exit 1
          fi

          echo "APK=$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ steps.apk.outputs.apk }}
          if-no-files-found: error
