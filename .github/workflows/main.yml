name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android project
        shell: bash
        run: |
          set -e

          echo "Repository:"
          pwd
          echo
          echo "Files:"
          find . -maxdepth 3 -type f \
            \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

          PROJECT_DIR=""

          if [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            PROJECT_DIR=$(find . -type f -name "gradlew" -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          echo "APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-debug-apk
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
