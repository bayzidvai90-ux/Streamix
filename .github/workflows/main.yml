name: Build Streamix BD APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" \
              -maxdepth 2 \
              -type f \
              -iname "*.zip" \
              -print -quit || true)

            if [ -n "$ZIP_FILE" ]; then
              rm -rf "$GITHUB_WORKSPACE/.android-project"
              mkdir -p "$GITHUB_WORKSPACE/.android-project"
              unzip -q -o "$ZIP_FILE" \
                -d "$GITHUB_WORKSPACE/.android-project"

              SETTINGS=$(find "$GITHUB_WORKSPACE/.android-project" \
                -type f \
                \( -name "settings.gradle" \
                -o -name "settings.gradle.kts" \) \
                -print -quit || true)

              if [ -n "$SETTINGS" ]; then
                PROJECT_DIR=$(dirname "$SETTINGS")
              fi
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 9.3.1
        run: |
          set -e

          VERSION="9.3.1"

          curl -fsSL \
            "https://services.gradle.org/distributions/gradle-${VERSION}-bin.zip" \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q \
            "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-${VERSION}/bin" \
            >> "$GITHUB_PATH"

          "$RUNNER_TEMP/gradle-${VERSION}/bin/gradle" \
            --version

      - name: Prepare build
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          echo "Project:"
          pwd

          echo "Gradle:"
          gradle --version

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode=all

      - name: Check APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          set -e

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit || true)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Streamix-BD-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
